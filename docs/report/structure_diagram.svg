<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <!-- actor -->
  <circle cx="70" cy="170" r="16" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M70,186 L70,226 M44,200 L96,200 M70,226 L50,256 M70,226 L90,256" stroke="#333" stroke-width="2" fill="none"/>
  <text x="70" y="280" text-anchor="middle" font-size="15" font-weight="bold">Student</text>
  <text x="70" y="298" text-anchor="middle" font-size="12" fill="#555">(external actor)</text>
  <!-- boundary -->
  <rect x="160" y="20" width="820" height="390" rx="10" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="176" y="44" font-size="14" font-weight="bold" fill="#555">SeatTogether system boundary</text>
  <!-- C1 -->
  <rect x="200" y="135" width="210" height="130" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
  <text x="305" y="162" text-anchor="middle" font-size="15" font-weight="bold">C1 Map UI</text>
  <text x="305" y="186" text-anchor="middle" font-size="12">Shows the table map,</text>
  <text x="305" y="202" text-anchor="middle" font-size="12">statuses and messages;</text>
  <text x="305" y="218" text-anchor="middle" font-size="12">sends check-in / check-out.</text>
  <text x="305" y="240" text-anchor="middle" font-size="11" fill="#555">app/page.tsx</text>
  <!-- C2 -->
  <rect x="510" y="135" width="220" height="130" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="2"/>
  <text x="620" y="162" text-anchor="middle" font-size="15" font-weight="bold">C2 Seat Status Service</text>
  <text x="620" y="186" text-anchor="middle" font-size="12">Applies the status rules</text>
  <text x="620" y="202" text-anchor="middle" font-size="12">(R1, R2, token); detects</text>
  <text x="620" y="218" text-anchor="middle" font-size="12">"no free table".</text>
  <text x="620" y="240" text-anchor="middle" font-size="11" fill="#555">lib/seatStatus.ts, app/api/</text>
  <!-- C3 -->
  <rect x="800" y="70" width="160" height="110" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="880" y="96" text-anchor="middle" font-size="15" font-weight="bold">C3 Table Layout</text>
  <text x="880" y="120" text-anchor="middle" font-size="12">Table IDs and</text>
  <text x="880" y="136" text-anchor="middle" font-size="12">grid positions</text>
  <text x="880" y="160" text-anchor="middle" font-size="11" fill="#555">data/layout.json</text>
  <!-- C4 -->
  <rect x="800" y="230" width="160" height="110" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="880" y="256" text-anchor="middle" font-size="15" font-weight="bold">C4 Status Store</text>
  <text x="880" y="280" text-anchor="middle" font-size="12">Current check-in</text>
  <text x="880" y="296" text-anchor="middle" font-size="12">of each table</text>
  <text x="880" y="320" text-anchor="middle" font-size="11" fill="#555">lib/statusStore.ts</text>
  <!-- arrows -->
  <line x1="100" y1="200" x2="196" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="128" y="190" text-anchor="middle" font-size="12">uses</text>
  <line x1="410" y1="200" x2="506" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="458" y="176" text-anchor="middle" font-size="12">HTTP + JSON</text>
  <text x="458" y="192" text-anchor="middle" font-size="11" fill="#555">(API contract)</text>
  <line x1="730" y1="180" x2="796" y2="135" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="758" y="132" text-anchor="middle" font-size="12">reads</text>
  <line x1="730" y1="220" x2="796" y2="275" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="790" y="292" text-anchor="end" font-size="12">reads /</text>
  <text x="790" y="308" text-anchor="end" font-size="12">writes</text>
  <!-- legend -->
  <text x="200" y="385" font-size="12" fill="#333">Arrow A → B: A uses (calls) B; results return along the same arrow. Boxes are logical components in one Next.js app, not separate servers.</text>
</svg>
