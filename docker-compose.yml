# Local and demo deployment: the app and its PostgreSQL database.
#   docker compose up --build -d     then open http://localhost:3000
# Check-ins are stored in the "pgdata" volume and survive a restart (issue #35).
# `docker compose down -v` deletes that volume.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seattogether
      POSTGRES_USER: seattogether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seattogether -d seattogether"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-seattogether:local}
    build: .
    environment:
      DATABASE_URL: postgres://seattogether:${POSTGRES_PASSWORD}@db:5432/seattogether
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
